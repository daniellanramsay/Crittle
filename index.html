<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Virtual Pet</title>
  <meta name="theme-color" content="#1f1d2b">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    /* Colours: DECISIONS §6. These are first-paint values; main.js applies
       config.colours over them. */
    :root {
      --background: #1f1d2b;
      --text: #f4f1ea;
      --accent: #f2a65a;
      --accent-text: #1f1d2b;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      /* Keeps clear of the iPad's rounded corners and home indicator */
      padding:
        max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    [hidden] { display: none !important; }

    button {
      min-width: 44px;
      min-height: 44px;
      padding: 10px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 72px; /* room for the version label */
    }

    /* The video and the landmark overlay, mirrored together so the dots stay
       on the hand (PLAN §6.1 step 4). main.js sets --ratio from the video. */
    .stage {
      --ratio: 1.3333;
      position: relative;
      width: min(100%, calc(70vh * var(--ratio)));
      aspect-ratio: var(--ratio);
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      transform: scaleX(-1);
    }

    .stage video,
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stage video { object-fit: fill; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 16px;
    }

    .status { margin: 0; font-weight: 600; }

    .readouts {
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px 16px;
      margin: 0;
    }

    .readouts dt { font-weight: 600; }
    .readouts dd { margin: 0; font-variant-numeric: tabular-nums; }

    /* The version label: 5 quick taps open the error log (PLAN §4.8). */
    .version-label {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text);
      font-weight: 400;
      touch-action: manipulation; /* no double-tap zoom while tapping quickly */
    }

    .badge {
      min-width: 24px;
      padding: 0 6px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 700;
      text-align: center;
    }

    /* The error log panel (A6) */
    .errorlog {
      width: min(100% - 32px, 760px);
      max-height: calc(100% - 32px);
      padding: 16px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      background: var(--background);
      color: var(--text);
    }

    .errorlog::backdrop { background: rgb(0 0 0 / 0.6); }
    .errorlog h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .errorlog p { margin: 0 0 12px; }

    .errorlog-entries {
      max-height: 50vh;
      margin: 0 0 12px;
      padding: 12px;
      overflow: auto;
      border-radius: 8px;
      background: #000;
      font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      -webkit-user-select: text;
    }

    .errorlog-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <p class="status" id="status" role="status">Camera off</p>
      <button type="button" id="camera-button">Turn on camera</button>
      <button type="button" id="retry-button" hidden>Try again</button>
    </div>

    <dl class="readouts">
      <dt>Detection rate</dt><dd id="readout-rate">–</dd>
      <dt>Detection time</dt><dd id="readout-time">–</dd>
      <dt>Delegate</dt><dd id="readout-delegate">–</dd>
      <dt>Video size</dt><dd id="readout-video">–</dd>
    </dl>
  </main>

  <button type="button" class="version-label" id="version-label">
    <span id="version-text">v?</span>
    <span class="badge" id="error-badge" hidden></span>
  </button>

  <dialog class="errorlog" id="errorlog" aria-labelledby="errorlog-title">
    <h2 id="errorlog-title">Error log</h2>
    <p id="errorlog-summary"></p>
    <pre class="errorlog-entries" id="errorlog-entries"></pre>
    <p id="errorlog-note" role="status"></p>
    <div class="errorlog-buttons">
      <button type="button" id="errorlog-copy">Copy</button>
      <button type="button" id="errorlog-clear">Clear</button>
      <button type="button" id="errorlog-test">Test error</button>
      <button type="button" id="errorlog-close">Close</button>
    </div>
  </dialog>

  <!-- The error log has its own script, so it still runs if another file
       fails to load (DECISIONS §3). -->
  <script type="module" src="./src/ui/errorlog.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
